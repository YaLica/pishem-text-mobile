<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>Тексttура — редактор постов</title>

<body>

<div class="panel">
<h1 class="texttura-brand"><img src="texttura-icon.png" alt="" width="24" height="24"> Текс<span>tt</span>ура</h1>
<label>📏 Платформа (Размер холста)</label>
<div class="row" style="margin-bottom: 10px;">
<button class="preset active" onclick="setPreset('telegram', this)" style="flex: 1 1 60%;">💬 Редактор MAX / Telegram</button>
<button class="preset" onclick="setPreset('custom', this)" style="flex: 1 1 30%;">⚙️ Свой размер PNG-пост</button>
</div>
<div id="widthControl" style="display: none; background: #2a2f3a50; padding: 10px; border-radius: 8px; margin-top: 10px;">
<label>Своя ширина: <span id="wLabel">800</span> px</label>
<input type="range" id="width" min="300" max="2000" value="800" oninput="updateCustomWidth()">
</div>
<hr style="border-color: #2a2f3a; margin: 15px 0;">

<div style="display: flex; gap: 10px; margin-bottom: 15px;">
<div style="flex: 1;">
<label style="color: #fff; margin-top: 0;">🎨 Фон поста</label>
<input type="color" id="bgColorPicker" value="#ffffff" oninput="updateBgColor(this.value)">
</div>
<div style="flex: 1;">
<label style="color: #fff; margin-top: 0;">✍️ Текст (общий)</label>
<input type="color" id="mainTextColorPicker" value="#000000" oninput="updateMainTextColor(this.value)">
</div>
</div>

<div id="myBackgroundControls" style="margin-bottom:15px;">
<button id="myBackgroundBtn" type="button" aria-expanded="false" aria-controls="myBackgroundMenu">Мой фон</button>
<input id="myBackgroundFile" type="file" accept="image/*" hidden>
<div id="myBackgroundMenu" hidden>
<button id="replaceBackgroundBtn" type="button">Заменить фон</button>
<button id="removeBackgroundBtn" type="button">Удалить фон</button>
</div>
</div>

<div style="margin-bottom: 15px;">
<label style="color: #fff; margin-top: 0;">🔤 Основной шрифт всего поста</label>
<select id="fontFamilySelector" onchange="updateFontFamily(this.value)">
<option value="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">📱 Системный (Стандарт)</option>
<option value="'Times New Roman', Times, serif" style="font-family: 'Times New Roman', Times, serif">🏛️ Классический: Times New Roman</option>
<option value="'Roboto', sans-serif" style="font-family: 'Roboto', sans-serif">🤖 Современный: Roboto</option>
<option value="'Open Sans', sans-serif" style="font-family: 'Open Sans', sans-serif">📖 Открытый: Open Sans</option>
<option value="'Montserrat', sans-serif" style="font-family: 'Montserrat', sans-serif">💎 Стильный: Montserrat</option>
<option value="'Inter', sans-serif" style="font-family: 'Inter', sans-serif">✨ Чистый: Inter</option>
<option value="'Oswald', sans-serif" style="font-family: 'Oswald', sans-serif">📏 Узкий: Oswald</option>
<option value="'Raleway', sans-serif" style="font-family: 'Raleway', sans-serif">⚜️ Элегантный: Raleway</option>
<option value="'Ubuntu', sans-serif" style="font-family: 'Ubuntu', sans-serif">🟢 Округлый: Ubuntu</option>
<option value="'Nunito', sans-serif" style="font-family: 'Nunito', sans-serif">☁️ Мягкий: Nunito</option>
<option value="'Rubik', sans-serif" style="font-family: 'Rubik', sans-serif">🟥 Плотный: Rubik</option>
<option value="'Exo 2', sans-serif" style="font-family: 'Exo 2', sans-serif">⚡ Техно: Exo 2</option>
<option value="'Merriweather', serif" style="font-family: 'Merriweather', serif">📚 Книжный: Merriweather</option>
<option value="'Playfair Display', serif" style="font-family: 'Playfair Display', serif">📰 Журнальный: Playfair Display</option>
<option value="'Lora', serif" style="font-family: 'Lora', serif">🪶 Поэтичный: Lora</option>
<option value="'PT Serif', serif" style="font-family: 'PT Serif', serif">🏢 Официальный: PT Serif</option>
<option value="'Cormorant Garamond', serif" style="font-family: 'Cormorant Garamond', serif">👑 Премиум: Cormorant Garamond</option>
<option value="'Tenor Sans', sans-serif" style="font-family: 'Tenor Sans', sans-serif">🎨 Гротеск: Tenor Sans</option>
<option value="'Alice', serif" style="font-family: 'Alice', serif">📜 Винтаж: Alice</option>
<option value="'Comfortaa', cursive" style="font-family: 'Comfortaa', cursive">🎈 Пузырьковый: Comfortaa</option>
<option value="'Caveat', cursive" style="font-family: 'Caveat', cursive">🖋️ Рукописный: Caveat</option>
<option value="'Bebas Neue', sans-serif" style="font-family: 'Bebas Neue', sans-serif">📢 ТИТУЛ: Bebas Neue</option>
<option value="'Russo One', sans-serif" style="font-family: 'Russo One', sans-serif">🔥 Мощный: Russo One</option>
<option value="'Pacifico', cursive" style="font-family: 'Pacifico', cursive">🌊 Летний: Pacifico</option>
<option value="'Kelly Slab', cursive" style="font-family: 'Kelly Slab', cursive">💻 Киберпанк: Kelly Slab</option>
<option value="'Neucha', cursive" style="font-family: 'Neucha', cursive">✍️ Маркер: Neucha</option>
<option value="'Amatic SC', cursive" style="font-family: 'Amatic SC', cursive">🎬 Кино: Amatic SC</option>
<option value="'Marck Script', cursive" style="font-family: 'Marck Script', cursive">☕ Кофейня: Marck Script</option>
<option value="'Bad Script', cursive" style="font-family: 'Bad Script', cursive">📝 Записки: Bad Script</option>
<option value="'Yeseva One', serif" style="font-family: 'Yeseva One', serif">🌸 Салон: Yeseva One</option>
<option value="'Philosopher', sans-serif" style="font-family: 'Philosopher', sans-serif">🕊️ Изящный: Philosopher</option>
<option value="'Oranienbaum', serif" style="font-family: 'Oranienbaum', serif">🏛️ Антиква: Oranienbaum</option>
<option value="'Roboto Mono', monospace" style="font-family: 'Roboto Mono', monospace">💾 Код: Roboto Mono</option>
<option value="'PT Mono', monospace" style="font-family: 'PT Mono', monospace">⌨️ Печатная машинка: PT Mono</option>
<option value="'Podkova', serif" style="font-family: 'Podkova', serif">🐴 Уютный: Podkova</option>
<option value="'Underdog', sans-serif" style="font-family: 'Underdog', sans-serif">💪 Акцентный: Underdog</option>
</select>
</div>

<div class="dual-slider-row" style="display: flex; gap: 10px; margin-bottom: 15px;">
<div style="flex: 1;">
<label style="color: #fff; margin-top: 0;">🔠 Размер: <span id="baseFontSizeLabel">32</span> px</label>
<input type="range" id="baseFontSlider" min="16" max="64" value="32" oninput="updateBaseFontSize(this.value)">
</div>
<div style="flex: 1;">
<label style="color: #fff; margin-top: 0;">↕️ Интервал: <span id="lineHeightLabel">1.2</span></label>
<input type="range" id="lineHeightSlider" min="0.8" max="2.5" step="0.05" value="1.2" oninput="updateLineHeight(this.value)">
</div>
</div>

<div class="toolbar">
<button id="btnUndo" onclick="undoAction()" title="Шаг назад (Ctrl+Z)" disabled>↩️</button>
<button id="btnRedo" onclick="redoAction()" title="Шаг вперед (Ctrl+Y)" disabled>↪️</button>
<div class="toolbar-divider"></div>
<button onclick="format('bold')" title="Жирный"><b>Ж</b></button>
<button onclick="format('italic')" title="Курсив"><i>К</i></button>
<button onclick="format('underline')" title="Подчеркнутый"><u>Ч</u></button>
<button onclick="format('strikeThrough')" title="Зачеркнутый"><s>S</s></button>
<button id="quoteBtn" type="button" onclick="togglePostQuote()" aria-pressed="false" title="Оформить выделенный текст как цитату">❝ Цитата</button>
<button id="exitQuoteBtn" type="button" onclick="exitPostQuote()" hidden style="display:none">Выйти из цитаты</button>
<button onclick="formatCode()" title="Код"><code>&lt;/&gt;</code></button>
<div class="toolbar-divider"></div>
<button onclick="format('justifyLeft')" title="По левому краю">|≡</button>
<button onclick="format('justifyCenter')" title="По центру">≡</button>
<button onclick="format('justifyRight')" title="По правому краю">≡|</button>
<button onclick="format('justifyFull')" title="По ширине">≡≡</button>
<div class="toolbar-divider"></div>
<button onclick="insertLink()" title="Ссылка">🔗</button>
<input type="color" id="wordColor" value="#ff0000" oninput="applyTextColor(this.value)" title="Цвет выделенного текста">
<button onclick="changeWordSize(1.2)" title="Увеличить выделенное">A+</button>
<button onclick="changeWordSize(0.85)" title="Уменьшить выделенное">A-</button>
<select onmousedown="saveSelectionBeforeAction()" onchange="applyWordFont(this.value); this.selectedIndex=0;" title="Шрифт выделенного слова" style="width:auto; min-width:65px; height:32px; padding:0 4px; font-size:12px; background:#2a2f3a; color:#e8e8e8; border:1px solid #2a2f3a; border-radius:6px; outline:none;">
<option value="">🔤 Слово</option>
<option value="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">📱 Системный (Стандарт)</option>
<option value="'Times New Roman', Times, serif" style="font-family: 'Times New Roman', Times, serif">🏛️ Классический: Times New Roman</option>
<option value="'Roboto', sans-serif" style="font-family: 'Roboto', sans-serif">🤖 Современный: Roboto</option>
<option value="'Open Sans', sans-serif" style="font-family: 'Open Sans', sans-serif">📖 Открытый: Open Sans</option>
<option value="'Montserrat', sans-serif" style="font-family: 'Montserrat', sans-serif">💎 Стильный: Montserrat</option>
<option value="'Inter', sans-serif" style="font-family: 'Inter', sans-serif">✨ Чистый: Inter</option>
<option value="'Oswald', sans-serif" style="font-family: 'Oswald', sans-serif">📏 Узкий: Oswald</option>
<option value="'Raleway', sans-serif" style="font-family: 'Raleway', sans-serif">⚜️ Элегантный: Raleway</option>
<option value="'Ubuntu', sans-serif" style="font-family: 'Ubuntu', sans-serif">🟢 Округлый: Ubuntu</option>
<option value="'Nunito', sans-serif" style="font-family: 'Nunito', sans-serif">☁️ Мягкий: Nunito</option>
<option value="'Rubik', sans-serif" style="font-family: 'Rubik', sans-serif">🟥 Плотный: Rubik</option>
<option value="'Exo 2', sans-serif" style="font-family: 'Exo 2', sans-serif">⚡ Техно: Exo 2</option>
<option value="'Merriweather', serif" style="font-family: 'Merriweather', serif">📚 Книжный: Merriweather</option>
<option value="'Playfair Display', serif" style="font-family: 'Playfair Display', serif">📰 Журнальный: Playfair Display</option>
<option value="'Lora', serif" style="font-family: 'Lora', serif">🪶 Поэтичный: Lora</option>
<option value="'PT Serif', serif" style="font-family: 'PT Serif', serif">🏢 Официальный: PT Serif</option>
<option value="'Cormorant Garamond', serif" style="font-family: 'Cormorant Garamond', serif">👑 Премиум: Cormorant Garamond</option>
<option value="'Tenor Sans', sans-serif" style="font-family: 'Tenor Sans', sans-serif">🎨 Гротеск: Tenor Sans</option>
<option value="'Alice', serif" style="font-family: 'Alice', serif">📜 Винтаж: Alice</option>
<option value="'Comfortaa', cursive" style="font-family: 'Comfortaa', cursive">🎈 Пузырьковый: Comfortaa</option>
<option value="'Caveat', cursive" style="font-family: 'Caveat', cursive">🖋️ Рукописный: Caveat</option>
<option value="'Bebas Neue', sans-serif" style="font-family: 'Bebas Neue', sans-serif">📢 ТИТУЛ: Bebas Neue</option>
<option value="'Russo One', sans-serif" style="font-family: 'Russo One', sans-serif">🔥 Мощный: Russo One</option>
<option value="'Pacifico', cursive" style="font-family: 'Pacifico', cursive">🌊 Летний: Pacifico</option>
<option value="'Kelly Slab', cursive" style="font-family: 'Kelly Slab', cursive">💻 Киберпанк: Kelly Slab</option>
<option value="'Neucha', cursive" style="font-family: 'Neucha', cursive">✍️ Маркер: Neucha</option>
<option value="'Amatic SC', cursive" style="font-family: 'Amatic SC', cursive">🎬 Кино: Amatic SC</option>
<option value="'Marck Script', cursive" style="font-family: 'Marck Script', cursive">☕ Кофейня: Marck Script</option>
<option value="'Bad Script', cursive" style="font-family: 'Bad Script', cursive">📝 Записки: Bad Script</option>
<option value="'Yeseva One', serif" style="font-family: 'Yeseva One', serif">🌸 Салон: Yeseva One</option>
<option value="'Philosopher', sans-serif" style="font-family: 'Philosopher', sans-serif">🕊️ Изящный: Philosopher</option>
<option value="'Oranienbaum', serif" style="font-family: 'Oranienbaum', serif">🏛️ Антиква: Oranienbaum</option>
<option value="'Roboto Mono', monospace" style="font-family: 'Roboto Mono', monospace">💾 Код: Roboto Mono</option>
<option value="'PT Mono', monospace" style="font-family: 'PT Mono', monospace">⌨️ Печатная машинка: PT Mono</option>
<option value="'Podkova', serif" style="font-family: 'Podkova', serif">🐴 Уютный: Podkova</option>
<option value="'Underdog', sans-serif" style="font-family: 'Underdog', sans-serif">💪 Акцентный: Underdog</option>
</select>
<button onclick="deleteSelection()" title="Удалить выделенное">❌</button>
<button onclick="cleanFormat()" title="Сбросить стили выделенного (Метёлка)">🧹</button>
</div>

<div class="emoji-desktop-only">
<div class="emoji-wrap" id="emojiWrap"></div>
</div>

<hr style="border-color: #2a2f3a; margin: 15px 0;">

<div style="background: #2a2f3a50; padding: 15px; border-radius: 8px;">
<label style="color: #4ade80;">🖼️ КАРТИНКИ</label>
<input type="file" accept="image/*" multiple onchange="insertMultipleImages(event)">
<div style="font-size: 11px; color: #9aa4b2; margin-top: 6px;">
<b>Мультивыбор:</b> можешь выбрать сразу несколько картинок.<br>
<b>Размер:</b> кликни и потяни за правый нижний угол ⇲.
</div>
<button id="btnDeleteImg" class="danger" onclick="deleteSelectedImage()" style="margin-top: 12px; padding: 8px; display: block;">🗑️ Удалить выбранную картинку</button>
<button class="primary" onclick="addTextBox()" style="margin-top: 12px; padding: 10px; background:#10b981;">➕ Добавить надпись (плашку)</button>
  <div id="tbSettings" style="display:none; background:#10b98120; padding:12px; border-radius:8px; margin-top:12px; border:1px solid #10b981;">
   <label style="color:#10b981; margin-top:0;">🎨 Настройки выбранной надписи</label>

  <!-- Форматирование текста внутри плашки. Кнопки те же функции, что и в
       верхнем тулбаре: они работают там, где стоит курсор. -->
  <div class="tb-toolbar">
    <button type="button" onclick="format('bold')" title="Жирный"><b>Ж</b></button>
    <button type="button" onclick="format('italic')" title="Курсив"><i>К</i></button>
    <button type="button" onclick="format('underline')" title="Подчеркнутый"><u>Ч</u></button>
    <button type="button" onclick="format('strikeThrough')" title="Зачеркнутый"><s>S</s></button>
    <button type="button" onclick="formatCode()" title="Моноширинный"><code>&lt;/&gt;</code></button>
    <div class="tb-toolbar-divider"></div>
    <button type="button" onclick="format('justifyLeft')" title="По левому краю">|≡</button>
    <button type="button" onclick="format('justifyCenter')" title="По центру">≡</button>
    <button type="button" onclick="format('justifyRight')" title="По правому краю">≡|</button>
    <div class="tb-toolbar-divider"></div>
    <input type="color" id="tbWordColor" value="#ffffff" oninput="applyTextColor(this.value)" title="Цвет выделенного текста">
    <button type="button" onclick="changeWordSize(1.2)" title="Увеличить выделенное">A+</button>
    <button type="button" onclick="changeWordSize(0.85)" title="Уменьшить выделенное">A-</button>
  </div>

  <label>🔠 Размер текста: <span id="tbFontSizeLabel">24</span> px</label>
  <input type="range" id="tbFontSize" min="10" max="120" value="24" oninput="setTbFontSize(this.value)">

  <label>↕️ Интервал строк: <span id="tbLineHeightLabel">1.25</span></label>
  <input type="range" id="tbLineHeight" min="0.8" max="2.5" step="0.05" value="1.25" oninput="setTbLineHeight(this.value)">

  <div class="tb-font-row">
    <label>🔤 Шрифт текста плашки</label>
    <select id="tbFontFamily" onchange="setTbFontFamily(this.value)">
      <option value="">Как основной текст</option>
    </select>
  </div>

  <label>🎨 Цвет фона плашки</label>
  <input type="color" id="tbBgColor" value="#000000" oninput="setTbBgColor(this.value)">
    <label>👻 Прозрачность фона: <span id="tbBgOpacityLabel">55</span>%</label>
  <input type="range" id="tbBgOpacity" min="0" max="100" value="55" oninput="setTbBgOpacity(this.value)">

  <button type="button" onclick="ttPanelTools()">Слои и прозрачность картинки</button>
  <button type="button" onclick="document.getElementById('tbImageInput').click()" style="width:100%; margin-top:10px; background:#10b981; color:#fff; padding:10px;">🖼️ Вставить картинку в плашку</button>
  <input type="file" id="tbImageInput" accept="image/*" style="display:none;" onchange="insertImageIntoTextBox(event)">

  <button type="button" id="tbRibbonToggle" onclick="toggleRibbonMode()" style="width:100%; margin-top:10px; background:#8b5cf6; color:#fff; padding:10px;">🎀 Добавить подложку для текста</button>

  <div id="tbRibbonSettings" style="display:none; background:#8b5cf620; padding:12px; border-radius:8px; margin-top:10px; border:1px solid #8b5cf6;">
    <label style="color:#a78bfa; margin-top:0;">🎀 Настройки подложки (лент)</label>
    <label>🎨 Цвет подложки</label>
    <input type="color" id="tbRibbonColor" value="#000000" oninput="setTbRibbonColor(this.value)">
    <label>👻 Прозрачность подложки: <span id="tbRibbonOpacityLabel">85</span>%</label>
    <input type="range" id="tbRibbonOpacity" min="0" max="100" value="85" oninput="setTbRibbonOpacity(this.value)">
    <label>⬜ Скругление: <span id="tbRibbonRadiusLabel">6</span> px</label>
    <input type="range" id="tbRibbonRadius" min="0" max="30" value="6" oninput="setTbRibbonRadius(this.value)">
    <label>↔️ Плотность (ширина): <span id="tbRibbonPadHLabel">0.3</span> em</label>
    <input type="range" id="tbRibbonPadH" min="0" max="1.5" step="0.05" value="0.3" oninput="setTbRibbonPadH(this.value)">
    <label>↕️ Высота подложки: <span id="tbRibbonPadVLabel">0.25</span></label>
    <input type="range" id="tbRibbonPadV" min="0" max="0.5" step="0.01" value="0.25" oninput="setTbRibbonPadV(this.value)"> 
  </div>
</div>
<div id="imgSettings">
  <label style="color:#4ade80; margin-top:0;">🎛️ Настройки выбранной картинки</label>
  <label>↔️ Отступ текста: <span id="imgGapLabel">20</span> px</label>
  <input type="range" id="imgGapRange" min="0" max="60" value="20" oninput="setImgGap(this.value)">
  <label>⬜ Скругление углов: <span id="imgRadiusLabel">12 px</span></label>

<script>
async function copyForTelegram() {
if (!editor.innerText.trim()) return;
const lines = getEditorLines();

// type=cite сохраняет семантику цитаты и для HTML-импортёров iOS.
const finalHtml = lines.join('<br>')
  .replace(/<br>(?=<blockquote>)/g, '')
  .replace(/<\/blockquote><br>/g, '</blockquote>')
  .replace(/<blockquote>/g, '<blockquote type="cite">');

// Plain-text строим напрямую из строк. innerText у элемента вне DOM
// в Chromium склеивает <br>, из-за чего раньше пропадали все отступы.
const finalPlain = lines.map(function(line) {
const row = document.createElement('div');
row.innerHTML = line;
row.querySelectorAll('a[href]').forEach(function(a) {
const href = sanitizeUrl(a.getAttribute('href'));
const text = a.textContent.trim();
a.textContent = href && text && text !== href ? text + ' (' + href + ')' : (href || text);
});
return row.textContent || '';
}).join('\n');

await writeToClipboard(finalHtml, finalPlain, 'copyTgBtn');
}
</script>

<script>
/* ==========================================================================
   size-align.js — написан заново

   Настройки текста и абзацев:

   1. Размер текста до 240 px (ползунки и кнопки A+ / A−).
   2. Выравнивание отдельно для каждой строки ОСНОВНОГО текста.
   3. Подсветку активной кнопки выравнивания.
   4. Единые блоки цитат, их снятие и выход в обычный текст.

   Чего этот файл НЕ делает — специально:
   • не перехватывает вставку текста (этим занимается editor-events.js),
   • не перехватывает вставку картинок,
   • не перестраивает редактор при загрузке, вводе, фокусе и отмене.

   Почему так. Прошлая версия при каждом действии перекраивала весь
   редактор и считала картинку разделителем строк: текст заворачивался
   в блок, а картинка выталкивалась наружу. Из-за этого ехала вёрстка,
   картинка уходила вниз и переставала слушаться курсора.

   Здесь картинка — обычная часть своей строки. Трогается только та
   строка, на которой стоит курсор. Всё остальное остаётся как есть.
   ========================================================================== */

(function () {
  'use strict';

  var MAX_SIZE = 240;

  function ready(fn) {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', fn);
    } else { fn(); }
  }

  /* ======================= 1. размер до 240 ======================= */

  function raiseSliders() {
    var base = document.getElementById('baseFontSlider');
    if (base) base.max = String(MAX_SIZE);
    var tb = document.getElementById('tbFontSize');
    if (tb) tb.max = String(MAX_SIZE);
  }

  // кнопки A+ / A- упирались в 200
  function patchWordSize() {
    if (typeof window.changeWordSize !== 'function') return;
    if (typeof window.getUsableRange !== 'function') return;

    window.changeWordSize = function (factor) {
      var range = getUsableRange(true);
      if (!range) return;
      var start = nodeAtRangeStart(range);
      var current = parseFloat(
        start ? getComputedStyle(start).fontSize
              : getComputedStyle(getEditingScope()).fontSize
      ) || 32;
      var next = Math.max(8, Math.min(MAX_SIZE, Math.round(current * factor)));
      var mark = makeTextMark({ fontSize: next + 'px' }, { 'data-custom-size': 'true' });
      wrapRange(range, mark, true, { property: 'fontSize' });
      finishTextOperation();
    };
  }

  /* ======================= 2. выравнивание ======================= */

  var paragraphRoot;

  // Строку заканчивает перенос <br> или готовый блок.
  // Картинка НЕ заканчивает строку: она стоит в строке вместе с текстом.
  function isLineBreaker(node) {
    if (!node || node.nodeType !== 1) return false;
    if (node.tagName === 'BR') return true;
    return isBlock(node);
  }

  function isBlock(node) {
    return node && node.nodeType === 1 &&
           (node.tagName === 'DIV' || node.tagName === 'P' || node.tagName === 'BLOCKQUOTE' || node.hasAttribute('data-para')) &&
           !node.closest('.img-box');
  }

  // Ближайший блок, внутри которого лежит узел. Именно он отвечает за
  // выравнивание своей строки. Брать самый верхний блок нельзя: Enter
  // иногда вкладывает новую строку внутрь предыдущей, и тогда выравнивание
  // задело бы соседний текст.
  function nearestBlock(node) {
    if (node && node.nodeType === 3) node = node.parentNode;
    while (node && node !== paragraphRoot) {
      if (isBlock(node)) return node;
      node = node.parentNode;
    }
    return null;
  }

  // поднимаемся до прямого потомка редактора
  function topLevel(node) {
    while (node && node.parentNode && node.parentNode !== paragraphRoot) {
      node = node.parentNode;
    }
    return (node && node.parentNode === paragraphRoot) ? node : null;
  }

  // строка целиком: соседи слева и справа до ближайшего переноса
  function lineAround(node) {
    var run = [node];
    var n = node.previousSibling;
    while (n && !isLineBreaker(n)) { run.unshift(n); n = n.previousSibling; }
    n = node.nextSibling;
    while (n && !isLineBreaker(n)) { run.push(n); n = n.nextSibling; }
    return run;
  }

  // верхнеуровневые узлы, попавшие в выделение
  function nodesInRange(range) {
    var out = [];
    Array.prototype.slice.call(paragraphRoot.childNodes).forEach(function (n) {
      var hit = false;
      try { hit = range.intersectsNode(n); } catch (e) { hit = false; }
      if (hit) out.push(n);
    });
    return out;
  }

  // пустой ли узел: пробелы и служебные символы за содержимое не считаем
  function isBlank(node) {
    if (node.nodeType !== 3) return false;
    return !(node.textContent || '').replace(/\u200B/g, '').trim();
  }

  // Строки, которые нужно выровнять. Каждая — либо готовый блок,
  // либо набор соседних узлов между переносами.
  function linesToAlign(range, caretMarker) {
    var lines = [];

    function addLine(nodes) {
      if (!nodes.length) return;
      // не дублируем уже собранную строку
      for (var i = 0; i < lines.length; i++) {
        if (lines[i][0] === nodes[0]) return;
      }
      lines.push(nodes);
    }

    if (range.collapsed) {
      // курсор стоит в тексте: берём ближайший блок, а если его нет —
      // собираем строку из соседей вокруг курсора
      var near = nearestBlock(caretMarker) || paragraphRoot;
      var top = caretMarker;
      while (top.parentNode !== near) top = top.parentNode;
      var run = lineAround(top);
      // Пустой перенос не превращаем в нулевой по высоте блок.
      if (!run.some(function (n) {
        return n.nodeType !== 8 && ((n.textContent || '').replace(/\u200B/g, '').length ||
          (n.nodeType === 1 && (n.matches('.img-box,img') || n.querySelector('.img-box,img'))));
      })) return lines;
      if (near !== paragraphRoot && run.length === near.childNodes.length) addLine([near]);
      else addLine(run);
      return lines;
    }

    // Выделение может пересекать несколько строк внутри одного контейнера.
    // Не берём контейнер целиком: проверяем каждую строку отдельно.
    function visit(parent) {
      var run = [];
      function flush() {
        if (!run.length) return;
        var part = document.createRange();
        part.setStartBefore(run[0]);
        part.setEndAfter(run[run.length - 1]);
        var overlap = part.cloneRange();
        if (overlap.compareBoundaryPoints(Range.START_TO_START, range) < 0)
          overlap.setStart(range.startContainer, range.startOffset);
        if (overlap.compareBoundaryPoints(Range.END_TO_END, range) > 0)
          overlap.setEnd(range.endContainer, range.endOffset);
        if (!overlap.collapsed && overlap.toString().replace(/\u200B/g, '').length) {
          addLine(parent !== paragraphRoot && run.length === parent.childNodes.length ? [parent] : run);
        }
        run = [];
      }
      Array.prototype.slice.call(parent.childNodes).forEach(function (n) {
        if (isLineBreaker(n)) {
          flush();
          if (isBlock(n)) visit(n);
        } else run.push(n);
      });
      flush();
    }
    visit(paragraphRoot);
    return lines;
  }

  // BR внутри жирного текста/ссылки тоже является границей строки.
  // Разделяем только inline-обёртки затронутого контейнера, перемещая
  // существующие узлы: картинки и их обработчики не пересоздаются.
  function exposeLineBreaks(range, caretMarker) {
    var scope = range.collapsed ? (nearestBlock(caretMarker) || paragraphRoot) : null;
    Array.prototype.slice.call(paragraphRoot.querySelectorAll('br')).forEach(function (br) {
      if (br.closest('.img-box')) return;
      var parentBlock = nearestBlock(br) || paragraphRoot;
      if (scope ? parentBlock !== scope : !range.intersectsNode(parentBlock)) return;
      while (br.parentNode !== parentBlock) {
        var inline = br.parentNode;
        var tail = inline.cloneNode(false);
        tail.removeAttribute('id');
        while (br.nextSibling) tail.appendChild(br.nextSibling);
        inline.parentNode.insertBefore(br, inline.nextSibling);
        if (tail.hasChildNodes()) br.parentNode.insertBefore(tail, br.nextSibling);
        if (!inline.hasChildNodes()) inline.remove();
      }
    });
  }

  function setAlign(el, align) {
    el.style.textAlign = align;
    // без второго свойства последняя строка убегает влево
    el.style.textAlignLast = (align === 'justify') ? 'left' : align;
  }

  // Оборачиваем строку в блок, чтобы у неё было своё выравнивание.
  // Картинки внутри остаются на своих местах — строка не распадается.
  function wrapLine(nodes) {
    var parent = nodes[0].parentNode;
    // В P допустим phrasing-элемент; display:block даёт отдельное выравнивание
    // без невалидного вложения DIV в P при сохранении и повторном открытии.
    var div = document.createElement(parent.tagName === 'P' ? 'span' : 'div');
    if (div.tagName === 'SPAN') div.style.display = 'block';
    div.setAttribute('data-para', '1');
    parent.insertBefore(div, nodes[0]);
    nodes.forEach(function (n) { div.appendChild(n); });

    // Блок сам начинает новую строку и сам её заканчивает, поэтому перенос
    // СРАЗУ ПОСЛЕ него становится лишним: он был концом этой же строки и
    // теперь добавил бы пустую строку, сдвинув текст ниже.
    var after = div.nextSibling;
    if (after && after.nodeType === 1 && after.tagName === 'BR') {
      div.parentNode.removeChild(after);
    }

    // Перенос ПЕРЕД блоком удалять нельзя. Он не относится к этой строке —
    // это конец предыдущей строки или пустая строка, поставленная Enter.
    // Раньше он тоже удалялся, и выравнивание абзаца съедало отступ над ним:
    // блок подпрыгивал вплотную к тексту выше, а нажатые Enter пропадали.
    return div;
  }

  function alignSelection(align, root) {
    paragraphRoot = root || editor;
    var sel = window.getSelection();
    if (!sel || !sel.rangeCount) return false;

    var range = sel.getRangeAt(0);
    if (!paragraphRoot.contains(range.commonAncestorContainer)) return false;

    // Закладки сохраняют и курсор между узлами (после вставки), и выделение
    // при перемещении строк. В историю и PNG они не попадают.
    var collapsed = range.collapsed;
    var start = document.createComment('align-start');
    var end = collapsed ? null : document.createComment('align-end');
    if (end) { var endRange = range.cloneRange(); endRange.collapse(false); endRange.insertNode(end); }
    var startRange = range.cloneRange(); startRange.collapse(true); startRange.insertNode(start);
    range = document.createRange();
    range.setStartAfter(start);
    if (end) range.setEndBefore(end); else range.collapse(true);
    exposeLineBreaks(range, start);
    range.setStartAfter(start);
    if (end) range.setEndBefore(end); else range.collapse(true);
    var lines = linesToAlign(range, start);

    // Кнопка работает и до ввода текста: создаёт пустой абзац-цитату.
    if (align === 'quote' && !lines.length && collapsed) {
      var emptyBlock = nearestBlock(start);
      if (emptyBlock && !(emptyBlock.textContent || '').replace(/\u200B/g, '').trim()) {
        lines.push([emptyBlock]);
      } else {
        var blank = document.createElement('br');
        start.parentNode.insertBefore(blank, start.nextSibling);
        lines.push([start, blank]);
      }
    }

    var quoteMode = align === 'quote';
    var quoteAncestors = lines.map(function(nodes) {
      var n = nodes[0].nodeType === 1 ? nodes[0] : nodes[0].parentElement;
      return n && n.closest('[data-post-quote],blockquote');
    });
    var removeQuotes = quoteMode && lines.length && quoteAncestors.every(Boolean);
    if (removeQuotes) {
      Array.from(new Set(quoteAncestors)).forEach(removeQuoteStyle);
    } else {
      var boxes = lines.map(function(nodes) {
        return nodes.length === 1 && isBlock(nodes[0]) ? nodes[0] : wrapLine(nodes);
      });
      if (quoteMode && boxes.length) {
        // Выделенные абзацы — одна цитата, включая пустые строки между ними.
        var whole = document.createRange();
        whole.setStartBefore(boxes[0].closest('[data-post-quote],blockquote') || boxes[0]);
        var lastBox = boxes[boxes.length - 1];
        whole.setEndAfter(lastBox.closest('[data-post-quote],blockquote') || lastBox);
        var fragment = whole.extractContents();
        // Старые цитаты внутри нового блока не создают вложенных полос.
        Array.from(fragment.querySelectorAll('[data-post-quote],blockquote')).forEach(removeQuoteStyle);
        var parent = whole.startContainer.nodeType === 1 ? whole.startContainer : whole.startContainer.parentElement;
        var inlineParent = parent.closest('p,span,b,i,strong,em,a');
        var quote = document.createElement(inlineParent && paragraphRoot.contains(inlineParent) ? 'span' : 'blockquote');
        quote.setAttribute('data-post-quote', '1');
        quote.setAttribute('data-para', '1');
        quote.style.cssText = 'display:block;margin:0 0 0 0.25em;border-left:0.12em solid currentColor;padding:0 0 0 0.65em;';
        quote.appendChild(fragment);
        whole.insertNode(quote);
      } else boxes.forEach(function(box) { setAlign(box, align); });
    }

    try {
      var r = document.createRange();
      r.setStartAfter(start);
      if (end) r.setEndBefore(end); else r.collapse(true);
      start.remove();
      if (end) end.remove();
      sel.removeAllRanges();
      sel.addRange(r);
    } finally {
      if (start.parentNode) start.remove();
      if (end && end.parentNode) end.remove();
    }

    return lines.length > 0;
  }

  function patchAlignment() {
    if (typeof window.applyAlignment !== 'function') return;
    var original = window.applyAlignment;

    window.applyAlignment = function (command) {
      var map = {
        justifyLeft: 'left',
        justifyCenter: 'center',
        justifyRight: 'right',
        justifyFull: 'justify'
      };
      var align = map[command];
      if (!align) return false;

      // выбрана картинка — прежнее поведение
      if (typeof currentImgBox !== 'undefined' && currentImgBox) {
        return original.call(this, command);
      }
      // текст в плашке — прежнее поведение, не трогаем
      if (typeof getEditingScope === 'function' && getEditingScope() !== editor) {
        return original.call(this, command);
      }

      if (typeof restoreSelection === 'function') restoreSelection();

      if (!alignSelection(align)) return false;

      if (typeof saveSelectionBeforeAction === 'function') saveSelectionBeforeAction();
      if (typeof updateRatio === 'function') updateRatio();
      if (typeof saveHistory === 'function') saveHistory();
      updateAlignButtons();
      return true;
    };
  }

  function removeQuoteStyle(node) {
    node.removeAttribute('data-post-quote');
    ['border-left', 'padding-left', 'margin-left'].forEach(function(p) { node.style.removeProperty(p); });
    if (node.tagName === 'BLOCKQUOTE') {
      var plain = document.createElement('div');
      Array.from(node.attributes).forEach(function(attr) { plain.setAttribute(attr.name, attr.value); });
      while (node.firstChild) plain.appendChild(node.firstChild);
      node.replaceWith(plain);
    }
  }

  // Split at the two selection boundaries, preserving the inline styles on both sides.
  function quoteSelectedRange(scope, sel, r) {
    const qsel = 'blockquote,[data-post-quote]';
    const element = n => n.nodeType === 1 ? n : n.parentElement;
    const sameQuote = element(r.commonAncestorContainer).closest(qsel);
    const start = document.createComment('start'), end = document.createComment('end');
    const meaningful = n => n.nodeType === 8 || n.nodeType === 3 && n.length ||
      n.nodeType === 1 && (n.matches('br,img,hr,[contenteditable=false]') ||
      Array.from(n.childNodes).some(meaningful));
    const place = (marker, atStart) => {
      const edge = r.cloneRange(); edge.collapse(atStart); edge.insertNode(marker);
    };
    place(end, false); place(start, true);
    function lift(marker) {
      while (marker.parentNode !== scope) {
        const left = marker.parentNode, right = left.cloneNode(false);
        while (marker.nextSibling) right.append(marker.nextSibling);
        left.after(marker);
        if (meaningful(right)) {
          if (meaningful(left)) right.removeAttribute('id');
          marker.after(right);
        }
        if (!meaningful(left)) left.remove();
      }
    }
    lift(end); lift(start);
    const fragment = document.createDocumentFragment();
    while (start.nextSibling !== end) fragment.append(start.nextSibling);
    const selected = Array.from(fragment.childNodes).filter(meaningful);
    const unquote = sameQuote || selected.length && selected.every(n => n.nodeType === 1 && n.matches(qsel));
    fragment.querySelectorAll(qsel).forEach(q => q.replaceWith(...q.childNodes));
    let quote;
    if (unquote) end.before(fragment);
    else {
      quote = document.createElement('blockquote');
      quote.dataset.postQuote = '1'; quote.dataset.para = '1';
      quote.style.cssText = 'display:block;margin:0;border-left:.12em solid currentColor;padding:0 0 0 .65em';
      quote.append(fragment); end.before(quote);
      // A block already ends its line; reuse the existing separator.
      let next = end.nextSibling;
      while (next && next.nodeType === 3 && !next.length) next = next.nextSibling;
      if (next && next.nodeName === 'BR') next.remove();
    }
    const result = document.createRange();
    if (quote) result.selectNodeContents(quote);
    else { result.setStartAfter(start); result.setEndBefore(end); }
    start.remove(); end.remove();
    sel.removeAllRanges(); sel.addRange(result);
    return true;
  }
  window.togglePostQuote = function() {
    if (typeof restoreSelection === 'function') restoreSelection();
    var scope = getEditingScope();
    if (scope.classList.contains('text-box')) scope = scope.querySelector('.tb-content');
    if (!scope) return;
    // До операции фиксируем ввод, чтобы отмена снимала именно цитату.
    saveHistory();
    const sel = window.getSelection(), range = sel.rangeCount && sel.getRangeAt(0);
    if (!range || !scope.contains(range.commonAncestorContainer)) return;
    if (range.collapsed) { if (!alignSelection('quote', scope)) return; }
    else quoteSelectedRange(scope, sel, range);
    releaseSelection();
    saveSelectionBeforeAction();
    updateRatio();
    saveHistory();
    updateQuoteButton();
  };
  function updateQuoteButton() {
    var btn = document.getElementById('quoteBtn');
    var sel = window.getSelection();
    var node = sel && sel.anchorNode;
    if (node && node.nodeType !== 1) node = node.parentElement;
    var quote = node && node.closest && node.closest('[data-post-quote],blockquote');
    if (btn) btn.setAttribute('aria-pressed', String(!!quote));
    var exit = document.getElementById('exitQuoteBtn');
    if (exit) { exit.hidden = !quote; exit.style.display = quote ? '' : 'none'; }
  }
  function activeQuote() {
    var selection = window.getSelection();
    if (!selection || !selection.rangeCount) return null;
    var range = selection.getRangeAt(0);
    var node = range.commonAncestorContainer;
    if (node.nodeType !== 1) node = node.parentElement;
    var quote = node && node.closest('[data-post-quote],blockquote');
    return quote && exportNode.contains(quote) ? quote : null;
  }
  window.exitPostQuote = function() {
    restoreSelection();
    var quote = activeQuote();
    if (!quote) return;
    saveHistory();
    var para = document.createElement(quote.parentElement.closest('p') ? 'span' : 'div');
    para.setAttribute('data-para', '1');
    para.style.display = 'block';
    para.appendChild(document.createElement('br'));
    quote.after(para);
    var range = document.createRange();
    range.setStart(para, 0);
    range.collapse(true);
    var sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(range);
    releaseSelection(); saveSelectionBeforeAction();
    var field = para.closest('[contenteditable="true"]');
    if (field) field.focus();
    updateRatio(); saveHistory(); updateQuoteButton();
  };
  function insertQuoteBreak(e, keepQuote) {
    var field = e.target.closest && e.target.closest('[contenteditable="true"]');
    if (!field || !exportNode.contains(field) || !e.cancelable || e.isComposing) return;
    var quote = activeQuote();
    if (!quote) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    var range = window.getSelection().getRangeAt(0);
    saveHistory();
    range.deleteContents();
    if (!keepQuote) {
      // Split at the caret: only the text before Enter remains quoted.
      var tail = document.createRange();
      tail.selectNodeContents(quote);
      tail.setStart(range.startContainer, range.startOffset);
      var fragment = tail.extractContents();
      var para = document.createElement(quote.parentElement.closest('p,span') ? 'span' : 'div');
      para.setAttribute('data-para', '1');
      para.style.display = 'block';
      if (fragment.textContent || fragment.querySelector('img,br')) para.appendChild(fragment);
      else para.appendChild(document.createElement('br'));
      quote.after(para);
      if (!quote.textContent && !quote.querySelector('img,br')) quote.remove();
      var first = para;
      while (first.firstChild && first.firstChild.nodeType === 1 &&
             !first.firstChild.matches('br,img,[contenteditable="false"]')) first = first.firstChild;
      range.setStart(first, 0); range.collapse(true);
      var selection = window.getSelection();
      selection.removeAllRanges(); selection.addRange(range);
      releaseSelection(); saveSelectionBeforeAction(); updateRatio(); saveHistory(); updateQuoteButton();
      return;
    }
    var br = document.createElement('br');
    range.insertNode(br);
    var rest = document.createRange();
    rest.selectNodeContents(quote); rest.setStartAfter(br);
    if (!rest.toString() && !rest.cloneContents().querySelector('br,img')) br.after(document.createElement('br'));
    range.setStartAfter(br); range.collapse(true);
    var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
    releaseSelection(); saveSelectionBeforeAction(); updateRatio(); saveHistory();
  }
  // beforeinput покрывает виртуальную клавиатуру; keydown — обычную.
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.isComposing) insertQuoteBreak(e, e.shiftKey);
  }, true);
  document.addEventListener('beforeinput', function(e) {
    if (e.inputType === 'insertParagraph' || e.inputType === 'insertLineBreak') insertQuoteBreak(e, e.inputType === 'insertLineBreak');
  }, true);
  document.addEventListener('selectionchange', updateQuoteButton);
  document.addEventListener('texttura:new-post', updateQuoteButton);

  /* ==================== 3. подсветка кнопок ==================== */

  var alignButtons = null;

  function collectAlignButtons() {
    alignButtons = {};
    Array.prototype.slice.call(document.querySelectorAll('button')).forEach(function (b) {
      var h = b.getAttribute('onclick') || b.getAttribute('onmousedown') || '';
      var m = h.match(/justify(Left|Center|Right|Full)/);
      if (m) alignButtons['justify' + m[1]] = b;
    });
  }

  function currentAlign() {
    var sel = window.getSelection();
    if (!sel || !sel.rangeCount) return null;
    var range = sel.getRangeAt(0);
    if (!editor.contains(range.commonAncestorContainer)) return null;

    var node = range.startContainer;
    if (node.nodeType === 3) node = node.parentNode;
    if (!node || !node.closest) return null;

    var box = node.closest('[data-para]') || editor;
    return getComputedStyle(box).textAlign;
  }

  function updateAlignButtons() {
    if (!alignButtons) collectAlignButtons();
    var cur = currentAlign();
    var back = {
      left: 'justifyLeft', start: 'justifyLeft',
      center: 'justifyCenter', right: 'justifyRight',
      end: 'justifyRight', justify: 'justifyFull'
    };
    var active = back[cur] || null;
    Object.keys(alignButtons).forEach(function (cmd) {
      alignButtons[cmd].classList.toggle('align-active', cmd === active);
    });
  }

  /* ========================== запуск ========================== */

  ready(function () {
    if (typeof editor === 'undefined' || !editor) return;

    raiseSliders();
    patchWordSize();
    patchAlignment();
    collectAlignButtons();

    // новая строка наследует выравнивание предыдущей
    editor.addEventListener('keyup', function (e) {
      if (e.key !== 'Enter') return;
      var sel = window.getSelection();
      if (!sel || !sel.rangeCount) return;
      var node = sel.getRangeAt(0).startContainer;
      if (node.nodeType === 3) node = node.parentNode;
      var cur = (node && node.closest) ? node.closest('[data-para]') : null;
      if (!cur) return;
      var prev = cur.previousElementSibling;
      if (prev && prev.hasAttribute && prev.hasAttribute('data-para') && !cur.style.textAlign) {
        cur.style.textAlign = prev.style.textAlign || '';
        cur.style.textAlignLast = prev.style.textAlignLast || '';
      }
      updateAlignButtons();
    });

    document.addEventListener('selectionchange', function () {
      clearTimeout(updateAlignButtons._t);
      updateAlignButtons._t = setTimeout(updateAlignButtons, 80);
    });

    updateAlignButtons();
  });

})();

<script id="texttura-mobile-image-tap-recovery">
/*
 * Восстановление пропущенного браузером касания картинки.
 * ВАЖНО: selectImgBox() и правило первого касания / двойного касания
 * (400 мс) в images.js НЕ изменяются. Новое открытие панели не вызывается.
 * Если основной touchend уже выбрал картинку, этот код ничего не делает.
 */
(function () {
  'use strict';
  if (typeof isMobile !== 'function' || typeof selectImgBox !== 'function' ||
      typeof lastImgTapTime === 'undefined') return;
  var root = document.getElementById('editor');
  if (!root) return;
  var candidate = null;

  root.addEventListener('touchstart', function (e) {
    candidate = null;
    if (!isMobile() || e.touches.length !== 1) return;
    var target = e.target;
    if (!target || !target.closest) return;
    var box = target.closest('.img-box');
    if (!box || target.closest('.img-resizer')) return;
    var touch = e.touches[0];
    candidate = {box:box, x:touch.clientX, y:touch.clientY, tapTime:lastImgTapTime};
  }, {passive:true});

  root.addEventListener('touchmove', function (e) {
    if (!candidate) return;
    if (e.touches.length !== 1) { candidate = null; return; }
    var touch = e.touches[0];
    if (Math.hypot(touch.clientX - candidate.x, touch.clientY - candidate.y) > 10)
      candidate = null;
  }, {passive:true});

  // images.js зарегистрировал свой обработчик раньше, поэтому сначала
  // отрабатывают штатные выбор / перетаскивание, и только потом эта страховка.
  root.addEventListener('touchend', function (e) {
    var tap = candidate;
    candidate = null;
    if (!tap || e.changedTouches.length !== 1 || !tap.box.isConnected) return;
    var touch = e.changedTouches[0];
    if (Math.hypot(touch.clientX - tap.x, touch.clientY - tap.y) > 10) return;
    if (lastImgTapTime === tap.tapTime) {
      // Не допускаем последующего синтетического click с повторным выбором.
      if (e.cancelable) e.preventDefault();
      selectImgBox(tap.box);
    }
  }, {passive:false});

  root.addEventListener('touchcancel', function () { candidate = null; }, {passive:true});
})();
</script>

#ttFrame [data-dir*=w]{left:0} #ttFrame [data-dir*=e]{right:0}
#ttFrame [data-dir*=n]::after{border-top-width:3px} #ttFrame [data-dir*=s]::after{border-bottom-width:3px}
#ttFrame [data-dir*=w]::after{border-left-width:3px} #ttFrame [data-dir*=e]::after{border-right-width:3px}
#ttFrame [data-dir=n],#ttFrame [data-dir=s]{left:50%;transform:translateX(-50%);cursor:ns-resize}
#ttFrame [data-dir=e],#ttFrame [data-dir=w]{top:50%;transform:translateY(-50%);cursor:ew-resize}
#ttFrame [data-dir=nw],#ttFrame [data-dir=se]{cursor:nwse-resize} #ttFrame [data-dir=sw],#ttFrame [data-dir=ne]{cursor:nesw-resize}
#ttFrame i{max-width:32%;max-height:32%}
#ttCrop footer{justify-content:flex-end} #ttPx{margin-right:auto;font:14px system-ui;font-variant-numeric:tabular-nums;white-space:nowrap}
#ttStatus:empty{display:none}
</style>
<dialog id="ttCrop" aria-labelledby="ttCropTitle">
<header><h3 id="ttCropTitle">Обрезка</h3><select id="ttFormat" aria-label="Пропорции кадра"><option>Свободно</option><option>Исходный</option><option>1:1</option><option>3:4</option><option>4:3</option><option>2:3</option><option>3:2</option><option>4:5</option><option>5:4</option><option>9:16</option><option>16:9</option><option>2:1</option><option>1:2</option><option>21:9</option></select></header>
<div id="ttViewport"><div id="ttStage"><img alt="" id="ttPhoto" draggable="false"><div id="ttFrame"><span id="ttAspect"></span><output id="ttPx"></output><i data-dir="n"></i><i data-dir="s"></i><i data-dir="e"></i><i data-dir="w"></i><i data-dir="ne"></i><i data-dir="sw"></i><i data-dir="se"></i><i data-dir="nw"></i></div></div></div>
<div role="status" id="ttStatus"></div>
<footer><button type="button" id="ttCancel">Отмена</button><button type="button" class="primary" id="ttApply">Применить</button></footer>
</dialog>
<script>
(() => {
  const by = id => document.getElementById(id);
  // Older posts keep their original pixel radius until the slider is touched.
  const applyOld = applyImgStyles, syncOld = syncImgMobilePanel;
  applyImgStyles = function(box) {
    applyOld(box);
    if (!box || box.dataset.roundPct == null) return;
    const value = box.dataset.roundPct + '%';
    box.style.setProperty('--img-radius',value);
    box.querySelector('img').style.borderRadius=value;
  };
  function showRadius() {
    const b=currentImgBox;
    if (!b) return;
    const img=b.querySelector('img');
    const n=b.dataset.roundPct;
    const px=parseInt(b.dataset.radius || '12',10);
    for(const key of ['imp','img']) {
      by(key+'RadiusRange').value=n == null ? Math.min(50,100*px/Math.max(1,Math.min(img.offsetWidth,img.offsetHeight))) : n;
      by(key+'RadiusLabel').textContent=n == null ? px+' px' : n+'%';
    }
  }
  syncImgMobilePanel=function(){syncOld();showRadius()};
  window.ttRound=function(v){
    if(!currentImgBox)return;
    currentImgBox.dataset.roundPct=v;
    applyImgStyles(currentImgBox);showRadius();scheduleHistorySave();
  };
  const d=by('ttCrop'),stage=by('ttStage'),photo=by('ttPhoto'),frame=by('ttFrame'),
    fmt=by('ttFormat'),apply=by('ttApply');
  let target=null,source=null,X=0,Y=0,W=1,H=1,A=1,B=1,drag=null,busy=false;
  const clamp=(x,max)=>Math.max(0,Math.min(x,max));
  function render(){
    by('ttAspect').textContent=fmt.selectedIndex>1?fmt.value:observedRatio(W,H);
    by('ttPx').textContent=W+' × '+H+' px';
    X=clamp(Math.round(X),A-W);Y=clamp(Math.round(Y),B-H);
    Object.assign(frame.style,{left:X/A*100+'%',top:Y/B*100+'%',width:W/A*100+'%',height:H/B*100+'%'});
  }
  function ratio(){
    if(fmt.selectedIndex===0)return 0;
    if(fmt.selectedIndex===1)return A/B;
    const [a,b]=fmt.value.split(':').map(Number);return a/b;
  }
  function exact(width,mw,mh){
    const [a,b]=fmt.value.split(':').map(Number);
    const k=Math.min(Math.floor(mw/a),Math.floor(mh/b),Math.max(1,Math.round(width/a)));
    return [a*k,b*k];
  }
  function observedRatio(w,h){
    const r=w/h;
    const standards=['1:1','4:3','3:4','3:2','2:3','4:5','5:4','16:9','9:16','2:1','1:2','21:9'];
    for(const name of standards){
      const [x,y]=name.split(':').map(Number);
      if(w*y===h*x)return name;
      if(Math.abs(Math.log(r*y/x))<0.012)return '≈ '+name;
    }
    const fmtNum=n=>n.toLocaleString('ru-RU',{maximumFractionDigits:2});
    return r>=1?fmtNum(r)+':1':'1:'+fmtNum(1/r);
  }
  fmt.onchange=()=>{
    const t=ratio(); if(!t){render();return}
    const cx=X+W/2,cy=Y+H/2;
    const width=Math.min(W,H*t);
    if(fmt.selectedIndex>1)[W,H]=exact(width,A,B);else {W=Math.max(1,Math.round(width));H=Math.max(1,Math.round(width/t))}
    X=cx-W/2;Y=cy-H/2;render();
  };
  window.ttOpenCrop=function(){
    if(d.open||!currentImgBox)return;
    const img=currentImgBox.querySelector('img');
    if(!img||!img.naturalWidth){imageImportNotice('Картинка ещё не загрузилась.');return}
    target=currentImgBox;source=img;A=W=img.naturalWidth;B=H=img.naturalHeight;X=Y=0;
    busy=false;apply.disabled=false;photo.src=img.src;
    fmt.selectedIndex=0;for(const b of fmt.options){const [w,h]=b.value.split(':').map(Number);b.disabled=w>A||h>B}
    by('ttStatus').textContent='';render();d.showModal();
  };
  stage.onpointerdown=e=>{
    if(busy||!e.isPrimary||e.button!==0||!frame.contains(e.target))return;
    const r=stage.getBoundingClientRect();
    drag={id:e.pointerId,x:e.clientX,y:e.clientY,X,Y,W,H,r,dir:e.target.dataset.dir||''};
    stage.setPointerCapture(e.pointerId);e.preventDefault();
  };
  stage.onpointermove=e=>{
    if(!drag||drag.id!==e.pointerId)return;
    const g=drag,dx=(e.clientX-g.x)*A/g.r.width,dy=(e.clientY-g.y)*B/g.r.height;
    const u=g.dir.includes('e')?1:g.dir.includes('w')?-1:0;
    const v=g.dir.includes('s')?1:g.dir.includes('n')?-1:0;
    if(!u&&!v){X=g.X+dx;Y=g.Y+dy;render();return}
    const ax=g.X+(1-u)*g.W/2,ay=g.Y+(1-v)*g.H/2;
    const mw=u>0?A-ax:u<0?ax:2*Math.min(ax,A-ax);
    const mh=v>0?B-ay:v<0?ay:2*Math.min(ay,B-ay);
    const t=ratio();
    if(t){
      const want=!u?(g.H+v*dy)*t:!v?g.W+u*dx:g.W+(u*dx+v*dy/t)/(1+1/(t*t));
      const width=Math.min(mw,mh*t,Math.max(1,t,want));
      if(fmt.selectedIndex>1)[W,H]=exact(width,mw,mh);else {W=Math.max(1,Math.round(width));H=Math.max(1,Math.round(width/t))}
    }else{
      W=Math.max(1,Math.round(clamp(g.W+u*dx,mw)));H=Math.max(1,Math.round(clamp(g.H+v*dy,mh)));
    }
    X=ax-(1-u)*W/2;Y=ay-(1-v)*H/2;render();
  };
  stage.onlostpointercapture=()=>drag=null;
  d.addEventListener('click',e=>e.stopPropagation());
  by('ttCancel').onclick=()=>{if(!busy)d.close()};
  d.oncancel=e=>{if(busy)e.preventDefault()};
  d.onclose=()=>{drag=null;target=source=null;photo.removeAttribute('src')};
  apply.onclick=async()=>{
    if(busy||!target?.isConnected)return;
    if(W===A&&H===B){d.close();return}
    busy=true;apply.disabled=true;by('ttStatus').textContent='Обрезаю…';
    try {
      const c=document.createElement('canvas'), k=Math.min(1,2400/Math.max(W,H));
      c.width=Math.max(1,Math.round(W*k));c.height=Math.max(1,Math.round(H*k));
      if(fmt.selectedIndex>1)[c.width,c.height]=exact(W*k,c.width,c.height);
      const paint=()=>c.getContext('2d').drawImage(source,X,Y,W,H,0,0,c.width,c.height);
      paint();
      const blob=await new Promise((ok,no)=>c.toBlob(b=>b?ok(b):no(Error()),'image/png'));
      let file=blob;
      if(fmt.selectedIndex>1){
        while(file.size>TEXTTURA_IMAGE_MAX_BYTES){
          file=await new Promise((ok,no)=>c.toBlob(b=>b?ok(b):no(Error()),'image/webp',.85));
          if(file.size<=TEXTTURA_IMAGE_MAX_BYTES)break;
          [c.width,c.height]=exact(c.width*.8,c.width,c.height);paint();
        }
      }
      const url=await preparePostImage(file);
      const probe=new Image();probe.src=url;await probe.decode();
      if(!target.isConnected)throw Error();
      saveHistory();source.src=url;
      d.close();saveHistory();updateRatio();requestAnimationFrame(()=>{positionMiniBar();showRadius()});
    }catch{by('ttStatus').textContent='Не удалось обрезать картинку. Оригинал сохранён.'}
    finally{busy=false;apply.disabled=false}
  };
})();
</script>

<style>
.text-box.tt-drop-ready {outline:3px solid #35d7ae!important;outline-offset:3px}
#ttAspect {position:absolute;left:50%;top:4px;transform:translateX(-50%);padding:3px 6px;border-radius:3px;background:#111b;color:white;font:600 13px/1.2 system-ui;pointer-events:none;white-space:nowrap}
#ttPx{white-space:normal}
</style>
<script>
(()=>{
  let highlighted=null;
  const at=(x,y)=>document.elementsFromPoint(x,y).map(n=>n.closest('.text-box')).find(n=>n&&exportNode.contains(n))||null;
  function mark(box){
    if(box===highlighted)return;
    if(highlighted)highlighted.classList.remove('tt-drop-ready');
    highlighted=box;
    if(box)box.classList.add('tt-drop-ready');
  }
  function transfer(box,panel){
    const old=box.querySelector('img'),content=panel.querySelector('.tb-content');
    if(!old||!content||!editor.contains(box))return false;
    mark(null);saveHistory();
    const pic=old.cloneNode(false);
    pic.className='tb-img';pic.contentEditable='false';
    pic.style.width=Math.min(old.offsetWidth||160,content.clientWidth||160)+'px';
    pic.style.maxWidth='100%';pic.style.height='auto';
    pic.style.borderRadius=box.dataset.roundPct!=null?box.dataset.roundPct+'%':(box.dataset.radius||12)+'px';
    pic.style.boxShadow=getComputedStyle(old).boxShadow;
    if(+box.dataset.rot)pic.style.transform='rotate('+Number(box.dataset.rot)+'deg)';
    content.appendChild(pic);wrapTbImage(pic);
    removeCenterSpacers(box);box.remove();hideMiniBar();closeImgMobilePanel();
    selectTextBox(panel);syncImgSettings();updateImgCounter();updateRatio();saveHistory();return true;
  }
  window.ttMovePhoto=transfer;
  document.addEventListener('dragover',e=>{
    if(!dragBox||!editor.contains(dragBox))return;
    const panel=at(e.clientX,e.clientY);mark(panel);
    if(panel){e.preventDefault();if(e.dataTransfer)e.dataTransfer.dropEffect='move'}
  },true);
  document.addEventListener('drop',e=>{
    const panel=dragBox&&at(e.clientX,e.clientY);mark(null);
    if(!panel||!transfer(dragBox,panel))return;
    dragBox=null;e.preventDefault();e.stopImmediatePropagation();
  },true);
  document.addEventListener('dragend',()=>mark(null),true);
  editor.addEventListener('touchmove',e=>{
    if(isTouchDraggingImg&&e.touches.length===1){const t=e.touches[0];mark(at(t.clientX,t.clientY))}
  },{passive:true});
  editor.addEventListener('touchend',e=>{
    const t=e.changedTouches[0],panel=t&&dragBox&&isTouchDraggingImg&&at(t.clientX,t.clientY);
    mark(null);
    if(!panel||!transfer(dragBox,panel))return;
    if(imgGhost)imgGhost.remove();
    imgGhost=null;dragBox=null;imageTouchStart=null;isTouchDraggingImg=false;
    if(e.cancelable)e.preventDefault();e.stopImmediatePropagation();
  },{capture:true,passive:false});
  editor.addEventListener('touchcancel',()=>mark(null),true);
})();
</script>
<style>
#ttFormat{display:block}
#ttViewport{grid-template-columns:minmax(0,1fr)}
#ttFrame #ttPx{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);padding:3px 6px;border-radius:3px;background:#111b;color:white;font:600 13px/1.2 system-ui;white-space:nowrap;pointer-events:none}
#ttLayers [aria-pressed=true]{background:#2479a8;color:white}
.text-box .tb-content:has([data-tt-layer]){position:relative;isolation:isolate}
.text-box .tb-img-wrap[data-tt-layer]{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.text-box .tb-img-wrap[data-tt-layer] img.tb-img{width:100%!important;height:100%!important;object-fit:contain;margin:0}
.text-box .tb-img-wrap[data-tt-layer] .tb-img-grip{display:none!important}
.tb-img-wrap[data-tt-layer=back]{z-index:-1}.tb-img-wrap[data-tt-layer=front]{z-index:1}
#ttLayers{box-sizing:border-box;width:min(390px,94vw);max-height:88dvh;overflow:auto;border:1px solid #465365;border-radius:12px;background:#191d24;color:white;padding:16px;color-scheme:dark}
#ttLayers::backdrop{background:#0008}#ttLayers h3{margin:0}#ttLayers button,#ttLayers select{margin:3px 0;min-height:36px}#ttLayers header{display:flex;align-items:center;justify-content:space-between}#ttLayers [hidden]{display:none!important}
</style>
<dialog id="ttLayers"><header><h3>Картинка</h3><button id="ttDone" aria-label="Закрыть">✕</button></header>
<select id="ttWhich" aria-label="Картинка в плашке"></select>
<div id="ttControls"><label for="ttAlpha">Прозрачность: <output id="ttAlphaVal"></output></label><input type="range" id="ttAlpha" min="0" max="100">
<div id="ttOrder"><button data-mode="inline">В тексте</button> <button data-mode="back">Под текст</button> <button data-mode="front">Над текстом</button></div></div>
<div id="ttDest"><select id="ttPanelList" aria-label="Плашка для картинки"></select><button id="ttPlace">Вставить в плашку</button></div></dialog>
<script>
(()=>{
const el=id=>document.getElementById(id),dlg=el('ttLayers'),choices=el('ttWhich'),places=el('ttPanelList');
let image,box,content,photos,panels;
function sync(){
 const wrap=image.closest('.tb-img-wrap'),mode=wrap?.dataset.ttLayer||'inline';
 const n=Math.round(100*(1-Number(image.style.opacity||1)));
 el('ttAlpha').value=n;el('ttAlphaVal').textContent=n+'%';
 for(const b of el('ttOrder').children)b.setAttribute('aria-pressed',b.dataset.mode===mode);
}
function show(pic){
 if(!pic?.isConnected||!pic.closest('.tb-content'))return;
 image=pic;box=image.closest('.img-box');content=image.closest('.tb-content');
 photos=content?Array.from(content.querySelectorAll('img.tb-img')):[image];
 choices.replaceChildren(...photos.map((_,i)=>new Option('Картинка '+(i+1),i)));choices.selectedIndex=photos.indexOf(image);
 choices.hidden=photos.length<2;el('ttOrder').hidden=!content;el('ttDest').hidden=!box;
 el('ttControls').hidden=false;el('ttDest').hidden=true;sync();if(!dlg.open)dlg.showModal();
}
function moveTo(panel){
 if(!box?.isConnected||!panel?.isConnected)return;
 if(window.ttMovePhoto(box,panel)){
   const imgs=panel.querySelectorAll('img.tb-img');show(imgs[imgs.length-1]);
 }
}
window.ttPicTools=()=>{
 box=currentImgBox;if(!box?.isConnected)return;
 panels=Array.from(exportNode.querySelectorAll('.text-box'));
 if(!panels.length){imageImportNotice('Добавьте плашку');return}
 if(panels.length===1){moveTo(panels[0]);return}
 places.replaceChildren(...panels.map((p,i)=>new Option('Плашка '+(i+1)+(p.innerText.trim()?' · '+p.innerText.trim().slice(0,28):''),i)));
 el('ttDest').hidden=false;choices.hidden=true;el('ttControls').hidden=true;
 if(!dlg.open)dlg.showModal();
};
window.ttPanelTools=()=>{const list=getTbTargetBox()?.querySelectorAll('img.tb-img');if(list?.length)show(list[0]);else imageImportNotice('В плашке пока нет картинки.')};
document.addEventListener('click',e=>{const wrap=e.target.closest('.tb-img-wrap');if(wrap&&!e.target.closest('.tb-img-grip'))show(wrap.querySelector('img'))},true);
choices.onchange=()=>{image=photos[choices.selectedIndex];sync()};
el('ttAlpha').oninput=e=>{image.style.opacity=String(1-e.target.value/100);sync();scheduleHistorySave()};
el('ttOrder').onclick=e=>{const mode=e.target.dataset.mode,wrap=image.closest('.tb-img-wrap');if(!mode||!wrap)return;
 saveHistory();if(mode==='inline')delete wrap.dataset.ttLayer;else wrap.dataset.ttLayer=mode;sync();updateRatio();saveHistory()};
el('ttPlace').onclick=()=>moveTo(panels[places.selectedIndex]);
el('ttDone').onclick=()=>dlg.close();dlg.addEventListener('click',e=>e.stopPropagation());
})();
</script>
</body>
